name: Build Release Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "daily-build-*"
      - "uat-daily-build-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    name: Prep
    runs-on: ubuntu-latest
    outputs:
      git_commit_short: ${{ steps.meta.outputs.git_commit_short }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Prepare dispatch metadata
        id: meta
        run: |
          {
            echo "git_commit_short=$(git rev-parse --short=12 HEAD)"
            echo "build_date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Show plan
        run: |
          echo "Git commit: ${{ steps.meta.outputs.git_commit_short }}"
          echo "Build date: ${{ steps.meta.outputs.build_date }}"

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # agent 本体按 go.mod 声明的最低版本构建, 保持兼容基线不漂移。
      - name: Setup Go (agent, go.mod baseline)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5

      - name: Build xconnect-edge-agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GIT_COMMIT: ${{ needs.prep.outputs.git_commit_short }}
          BUILD_DATE: ${{ needs.prep.outputs.build_date }}
          GO_BUILD_TAGS: ""
        run: |
          mkdir -p dist
          go build -tags "${GO_BUILD_TAGS}" -trimpath -ldflags="-s -w -X main.serviceName=xconnect-edge-agent -X main.gitCommit=${GIT_COMMIT} -X main.buildDate=${BUILD_DATE}" -o dist/xconnect-edge-agent ./cmd/agent

      # caddy-l4@v0.1.3 的 go.mod 声明 "go 1.26.9", 但该版本并不存在
      # (Go 官方 1.26 线只有 1.26.11)。这里取同一条线的最新补丁版本, 满足其
      # >= 1.26.9 的语义要求。不改 go.mod: 那会把 agent 本体的 Go 下限从
      # 1.26.0 抬到 1.26.9, 与它的实际需求脱节, 也会牵连所有构建方。
      - name: Setup Go (caddy plugins)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.26.11"
          cache: false

      - name: Build custom caddy
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          # xcaddy 必须用与插件要求一致的 Go 重建, 否则会命中 cached toolchain。
          GOTOOLCHAIN=local go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5
          # caddy 与每个插件都必须钉版本: 不钉的话 xcaddy 会拉最新 tag,
          # 上游一旦发布不兼容版本, 同一条 CI 会在没有任何改动的情况下变红
          # (本次 caddy-l4 v0.1.3 引入 go 1.26.9 就是这么爆的)。
          "$(go env GOPATH)/bin/xcaddy" build v2.11.7 \
            --with github.com/caddy-dns/cloudflare@v0.2.4 \
            --with github.com/caddy-dns/alidns@v1.0.29 \
            --with github.com/mholt/caddy-l4@v0.1.3 \
            --output dist/caddy

      - name: Prepare bundle
        run: |
          mkdir -p bundle/config release-assets
          cp dist/xconnect-edge-agent bundle/xconnect-edge-agent
          cp dist/caddy bundle/caddy
          cp account-agent.yaml bundle/account-agent.yaml
          cp config/*.template.json bundle/config/
          tar -czf "release-assets/artifact-${{ matrix.goarch }}-${{ needs.prep.outputs.git_commit_short }}.tar.gz" -C bundle .
          cp dist/xconnect-edge-agent "release-assets/xconnect-edge-agent-linux-${{ matrix.goarch }}"
          cp dist/caddy "release-assets/caddy-linux-${{ matrix.goarch }}"
          # 为每个产物生成 sha256。消费方(playbooks 的 agent-proxy role)必须先
          # 校验再安装: 没有校验和就只能"下载即信任", 那和直接 curl | bash 没区别。
          cd release-assets
          sha256sum ./*.tar.gz ./*-linux-${{ matrix.goarch }} > "SHA256SUMS-linux-${{ matrix.goarch }}"
          cat "SHA256SUMS-linux-${{ matrix.goarch }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-assets-${{ matrix.goarch }}-${{ needs.prep.outputs.git_commit_short }}
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

          for file in release-assets/*; do
            for i in 1 2 3 4 5; do
              if timeout 60 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "$file" --clobber; then
                break
              fi
              echo "Upload for $file failed, retrying..."
              sleep 5
              if [ $i -eq 5 ]; then exit 1; fi
            done
          done

      - name: Load Vault mirror & dispatch secrets
        id: vault
        continue-on-error: true
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-xconnect-edge-agent
          jwtGithubAudience: vault
          ignoreNotFound: true
          secrets: |
            kv/data/prod/platform/storage/cloudflare-r2 access_key_id | R2_ACCESS_KEY_ID ;
            kv/data/prod/platform/storage/cloudflare-r2 secret_access_key | R2_SECRET_ACCESS_KEY ;
            kv/data/prod/platform/storage/cloudflare-r2 bucket | R2_BUCKET ;
            kv/data/prod/platform/storage/cloudflare-r2 endpoint | R2_ENDPOINT ;
            kv/data/prod/platform/storage/aliyun-oss access_key_id | OSS_ACCESS_KEY_ID ;
            kv/data/prod/platform/storage/aliyun-oss access_key_secret | OSS_ACCESS_KEY_SECRET ;
            kv/data/prod/platform/storage/aliyun-oss bucket | OSS_BUCKET ;
            kv/data/prod/platform/storage/aliyun-oss endpoint | OSS_ENDPOINT ;
            kv/data/prod/platform/distribution/dispatch-token token | DISPATCH_TOKEN ;

      - name: Sync dual mirrors & notify distribution hub
        env:
          R2_ACCESS_KEY_ID: ${{ steps.vault.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.vault.outputs.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ steps.vault.outputs.R2_BUCKET }}
          R2_ENDPOINT: ${{ steps.vault.outputs.R2_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ steps.vault.outputs.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.vault.outputs.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ steps.vault.outputs.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ steps.vault.outputs.OSS_ENDPOINT }}
          DISPATCH_TOKEN: ${{ steps.vault.outputs.DISPATCH_TOKEN }}
        run: ./scripts/ci/sync_release_mirrors.sh xconnect-edge-agent "${GITHUB_REF_NAME}" release-assets latest
