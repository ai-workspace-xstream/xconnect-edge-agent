mode: "agent"

log:
  level: info

agent:
  role: "agent-proxy"
  id: "edge-node-1"
  controllerUrl: "https://accounts.svc.plus"
  apiToken: "replace-with-agent-token"
  httpTimeout: 15s
  statusInterval: 1m
  # Quota revocations are applied on the next sync.
  syncInterval: 10m
  tls:
    insecureSkipVerify: false

billing:
  enabled: true
  baseURL: "https://billing.svc.plus"
  httpTimeout: 15s
  collectInterval: 1m
  reconcileInterval: 5m

xray:
  sync:
    enabled: true
    interval: 10m
    targets:
      - name: "xhttp"
        outputPath: "/usr/local/etc/xray/config.json"
        templatePath: "config/xray.xhttp.template.json"
        validateCommand: []
        restartCommand:
          - "systemctl"
          - "restart"
          - "xray.service"
        dynamicUsers:
          enabled: true
          executable: "/usr/local/bin/xray"
          server: "127.0.0.1:10086"
      - name: "tcp"
        outputPath: "/usr/local/etc/xray/tcp-config.json"
        templatePath: "config/xray.tcp.template.json"
        validateCommand: []
        restartCommand:
          - "systemctl"
          - "restart"
          - "xray-tcp.service"
        dynamicUsers:
          enabled: true
          executable: "/usr/local/bin/xray"
          server: "127.0.0.1:10087"
