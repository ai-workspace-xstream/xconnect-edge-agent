mode: "agent"

log:
  level: info

agent:
  # Set these per deployment, e.g. region: hk, pool: hk-main.
  region: ""
  pool: ""
  # Regional discovery metadata. entryPoint defaults to domain when omitted.
  # Set region/pool to the deployed region and pool; never use a runtime node IP.
  # entryPoint: region-entry.example.com
  # openToUsers: true
  # Unique identifier for this agent node
  id: "hk-xhttp.svc.plus"
  # URL of the accounts.svc.plus controller
  controllerUrl: "https://accounts-svc-plus-266500572462.asia-northeast1.run.app"
  # Authentication token 
  apiToken: "${INTERNAL_SERVICE_TOKEN}"

  httpTimeout: 15s
  statusInterval: 1m
  # Quota revocations are applied on the next sync.
  syncInterval: 10m

  tls:
    insecureSkipVerify: false

xray:
  sync:
    enabled: true
    interval: 10m
    # Optional runtime tuning for every target. Controller-sent tuning overrides
    # these field by field; a change restarts Xray via restartCommand.
    # bufferSizeKB is the per-connection relay buffer capacity, not a memory
    # cap: raising it can raise throughput and worst-case memory. Pick a value
    # only after a concurrent load test (throughput, RSS, CPU, upload failures).
    # tuning:
    #   logLevel: warning
    #   connIdleSeconds: 300
    #   xhttpScMaxEachPostBytes: 1000000
    targets:
      # XHTTP Transport Configuration
      - name: "xhttp"
        outputPath: "/usr/local/etc/xray/config.json"
        templatePath: "/usr/local/etc/xray/templates/xray.xhttp.template.json"
        # Sidecar mode: no xray binary in this container. With xray on the
        # host, use ["/usr/local/bin/xray", "run", "-test", "-config", "{config}"].
        validateCommand: []
        restartCommand: [] # Sidecar mode uses shared volume, no systemctl

      # TCP Transport Configuration
      - name: "tcp"
        outputPath: "/usr/local/etc/xray/tcp-config.json"
        templatePath: "/usr/local/etc/xray/templates/xray.tcp.template.json"
        validateCommand: []
        restartCommand: []
